services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # host workspace mounted so the bot can create project directories
      - ${HOST_WORKSPACE}:/workspace
      # gh CLI auth (read-only)
      - ${HOME}/.config/gh:/home/botuser/.config/gh:ro
      # claude CLI auth
      - ${HOME}/.claude:/home/botuser/.claude:ro
      - ${HOME}/.claude.json:/home/botuser/.claude.json:ro
