services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # host workspace mounted so the bot can create project directories
      - ${HOST_WORKSPACE}:/workspace
      # auth files shared with host (rw so token refresh propagates)
      - ${HOME}/.config/gh:/mnt/gh
      # Docker socket for container management (deploy)
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - llm-network

networks:
  llm-network:
    external: true
