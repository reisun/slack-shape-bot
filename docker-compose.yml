services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # host workspace mounted so the bot can create project directories
      - ${HOST_WORKSPACE}:/workspace
      # auth files mounted read-only; entrypoint copies them to writable locations
      - ${HOME}/.config/gh:/mnt/gh:ro
      - ${HOME}/.claude:/mnt/claude:ro
      - ${HOME}/.claude.json:/mnt/claude.json:ro
